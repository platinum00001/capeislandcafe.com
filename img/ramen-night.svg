<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="75%"><stop offset="0" stop-color="#3a2a1e"/><stop offset=".6" stop-color="#22201f"/><stop offset="1" stop-color="#151619"/></radialGradient>
  <radialGradient id="broth" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#f3c472"/><stop offset=".55" stop-color="#d89545"/><stop offset="1" stop-color="#a7632a"/></radialGradient>
  <radialGradient id="bowlout" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#2f3d5c"/><stop offset="1" stop-color="#0b1a3b"/></radialGradient>
  <radialGradient id="yolk" cx="45%" cy="45%" r="60%"><stop offset="0" stop-color="#ffb52e"/><stop offset="1" stop-color="#e07a12"/></radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
<g id="leaf1"><path d="M0 -46 C20 -30 38 -8 30 16 C24 34 8 40 0 52 C-8 40 -24 34 -30 16 C-38 -8 -20 -30 0 -46Z"/><path d="M0 -40 V60" stroke="#00000033" stroke-width="3" fill="none"/></g></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<!-- wood board -->
<g opacity=".18" stroke="#c99d55" stroke-width="2" fill="none">
  <path d="M0 120 C400 100 1200 140 1600 110"/><path d="M0 260 C500 240 1100 290 1600 250"/><path d="M0 640 C400 620 1200 670 1600 630"/><path d="M0 780 C500 760 1100 800 1600 770"/>
</g>
<!-- leaves -->

<g transform="translate(250 190) rotate(-28) scale(1.6)" fill="#c8611f"><use href="#leaf1"/></g>
<g transform="translate(1360 700) rotate(38) scale(1.9)" fill="#d98a1c"><use href="#leaf1"/></g>
<g transform="translate(1420 210) rotate(122) scale(1.3)" fill="#9e3b1b"><use href="#leaf1"/></g>
<g transform="translate(200 720) rotate(70) scale(1.25)" fill="#e0a526"><use href="#leaf1"/></g>
<!-- small pumpkin -->
<g transform="translate(1270 420)">
  <ellipse cx="-34" cy="10" rx="44" ry="50" fill="#d9731c"/><ellipse cx="34" cy="10" rx="44" ry="50" fill="#d9731c"/><ellipse cx="0" cy="8" rx="46" ry="54" fill="#ee8a26"/>
  <path d="M0 -44 C-4 -60 4 -72 14 -78" stroke="#5b4a2a" stroke-width="9" fill="none" stroke-linecap="round"/>
</g>
<!-- drink glass -->
<g transform="translate(330 450)" filter="url(#sh)">
  <rect x="-62" y="-110" width="124" height="220" rx="16" fill="#ffffff22" stroke="#ffffff66" stroke-width="4"/>
  <rect x="-54" y="-60" width="108" height="162" rx="10" fill="#d0452e" opacity=".85"/>
  <rect x="-40" y="-50" width="30" height="30" rx="6" fill="#ffffff55"/><rect x="5" y="-20" width="32" height="32" rx="6" fill="#ffffff44"/>
  <circle cx="44" cy="-108" r="34" fill="#f7c948" stroke="#e8a92a" stroke-width="5"/><path d="M44 -140 V-76 M12 -108 H76" stroke="#e8a92a" stroke-width="3"/>
  <path d="M-10 -150 L20 60" stroke="#fdcb2e" stroke-width="8" stroke-linecap="round"/>
</g>
<!-- bowl -->
<g transform="translate(800 450)" filter="url(#sh)">
  <circle r="330" fill="url(#bowlout)"/>
  <circle r="330" fill="none" stroke="#c99d55" stroke-width="6" opacity=".7"/>
  <circle r="292" fill="#f5efe2"/>
  <circle r="276" fill="url(#broth)"/>
  <!-- noodles -->
  <g fill="none" stroke="#f6dd8e" stroke-width="13" stroke-linecap="round" opacity=".95">
    <path d="M-200 60 C-150 0 -90 120 -40 50 S 40 120 90 40 S 170 110 210 40"/>
    <path d="M-210 110 C-160 40 -100 170 -40 100 S 50 170 100 90 S 180 160 200 100"/>
    <path d="M-180 160 C-130 100 -70 210 -10 150 S 80 210 130 140 S 190 190 170 160"/>
    <path d="M-150 200 C-100 150 -40 240 20 190 S 110 230 140 190"/>
  </g>
  <g fill="none" stroke="#e9c766" stroke-width="5" stroke-linecap="round" opacity=".7">
    <path d="M-190 85 C-140 25 -80 145 -30 75 S 50 145 100 65"/><path d="M-160 185 C-110 125 -50 225 10 170 S 100 220 150 165"/>
  </g>
  <!-- chashu slices -->
  <g transform="translate(-120 -120) rotate(-15)"><ellipse rx="92" ry="66" fill="#8a4a2a"/><ellipse rx="78" ry="54" fill="#d9a07a"/><path d="M-50 -10 C-10 -30 30 10 60 -5" stroke="#f3d3b5" stroke-width="8" fill="none"/><ellipse rx="92" ry="66" fill="none" stroke="#5e2c16" stroke-width="5"/></g>
  <g transform="translate(-30 -170) rotate(10)"><ellipse rx="80" ry="58" fill="#8a4a2a"/><ellipse rx="66" ry="46" fill="#dfa982"/><path d="M-40 6 C-6 -16 26 18 50 0" stroke="#f3d3b5" stroke-width="7" fill="none"/><ellipse rx="80" ry="58" fill="none" stroke="#5e2c16" stroke-width="5"/></g>
  <!-- eggs -->
  <g transform="translate(130 -110) rotate(20)"><ellipse rx="70" ry="52" fill="#fffaf0"/><ellipse cx="4" rx="38" ry="30" fill="url(#yolk)"/></g>
  <g transform="translate(185 -10) rotate(-25)"><ellipse rx="66" ry="50" fill="#fffaf0"/><ellipse cx="2" rx="36" ry="28" fill="url(#yolk)"/></g>
  <!-- nori -->
  <rect x="150" y="-250" width="80" height="170" rx="6" fill="#1c2a1f" transform="rotate(28 190 -165)"/>
  <rect x="160" y="-240" width="12" height="150" fill="#2c4231" transform="rotate(28 190 -165)"/>
  <!-- naruto -->
  <g transform="translate(-200 -10)"><circle r="42" fill="#fffaf0" stroke="#f1e6d2" stroke-width="4"/><path d="M0 0 m-4 0 a4 4 0 1 1 8 0 a10 10 0 1 1 -20 0 a16 16 0 1 1 32 0 a22 22 0 1 1 -44 0" fill="none" stroke="#e05a7a" stroke-width="5"/></g>
  <!-- corn -->
  <g fill="#fdcb2e" stroke="#e8a92a" stroke-width="2">
    <circle cx="40" cy="-40" r="9"/><circle cx="58" cy="-30" r="9"/><circle cx="48" cy="-14" r="9"/><circle cx="66" cy="-6" r="9"/><circle cx="30" cy="-20" r="9"/><circle cx="76" cy="-48" r="9"/>
  </g>
  <!-- scallions -->
  <g fill="#7fb04a" stroke="#4f7a2a" stroke-width="2">
    <circle cx="-60" cy="-40" r="9"/><circle cx="-40" cy="-28" r="8"/><circle cx="-80" cy="-20" r="7"/><circle cx="-20" cy="-50" r="8"/><circle cx="-55" cy="-8" r="8"/><circle cx="0" cy="-20" r="7"/><circle cx="-100" cy="-56" r="7"/>
  </g>
  <!-- sesame -->
  <g fill="#fff3d6"><ellipse cx="-10" cy="10" rx="4" ry="2"/><ellipse cx="20" cy="0" rx="4" ry="2"/><ellipse cx="-70" cy="20" rx="4" ry="2"/><ellipse cx="100" cy="40" rx="4" ry="2"/><ellipse cx="60" cy="20" rx="4" ry="2"/></g>
  <!-- oil sheen -->
  <g fill="#ffe7a8" opacity=".55"><circle cx="-150" cy="-200" r="8"/><circle cx="-200" cy="-140" r="5"/><circle cx="220" cy="120" r="7"/><circle cx="230" cy="80" r="4"/><circle cx="-230" cy="40" r="6"/></g>
</g>
<!-- chopsticks -->
<g filter="url(#sh)">
  <path d="M1030 300 L1470 150" stroke="#8b5a32" stroke-width="22" stroke-linecap="round"/>
  <path d="M1045 345 L1490 215" stroke="#a06a3c" stroke-width="22" stroke-linecap="round"/>
</g>
</svg>
